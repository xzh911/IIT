name: Build iOS IPA (SideStore, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "下载官方 web 基线 (asset cdn-www-v1)"
        # reference/cdn-www 是版权内容不入库；由本地打包上传到 GitHub Release，
        # CI 解压后即可复用与本地一致的构建流程。
        run: |
          mkdir -p reference
          curl -sL -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/cdn-www.zip \
            https://github.com/xzh911/IIT/releases/download/cdn-www-v1/cdn-www.zip
          unzip -q /tmp/cdn-www.zip -d reference/

      - name: "下载并校验首页高保真资源 (asset home-assets-v1)"
        run: |
          mkdir -p web/fixtures/private/home
          curl -fsSL -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/home-assets-v1.zip \
            https://github.com/xzh911/IIT/releases/download/home-assets-v1/home-assets-v1.zip
          unzip -q -j /tmp/home-assets-v1.zip -d web/fixtures/private/home
          python3 tools/verify-home-assets.py web/fixtures/private/home

      - name: 构建 web/www（纯 python3，macos 自带）
        run: bash web/build.sh

      - name: 构建免签 IPA（xcodebuild CODE_SIGNING_ALLOWED=NO）
        run: bash ios/build-ipa.sh

      - name: "校验 IPA 内首页高保真资源"
        run: python3 tools/verify-home-assets.py --ipa ios/out/etax-sim.ipa

      - name: 上传 IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: etax-sim-ipa
          path: ios/out/etax-sim.ipa
          if-no-files-found: error

      - name: 发布 IPA 到 GitHub Release
        # 每次构建发一个新 release（tag 递增），可用 gh release download --latest 拉最新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="etax-sim-r${{ github.run_number }}"
          gh release create "$TAG" ios/out/etax-sim.ipa \
            -R "${{ github.repository }}" \
            --title "etax-sim IPA r${{ github.run_number }}" \
            --notes "免签 IPA（SideStore 安装，测试/复刻用途）。首页资源 home-assets-v1 已通过 manifest SHA-256 校验。$(date -u '+%Y-%m-%d %H:%M UTC') · commit ${{ github.sha }}"
